    async function deploy() {
        const status = document.getElementById('status');
        const resultsDiv = document.getElementById('results');
        const btn = document.getElementById('deployBtn');

        try {
            status.innerText = "Connecting & Signing...";
            btn.disabled = true;

            const provider = new ethers.JsonRpcProvider(RPC_URL);
            const wallet = new ethers.Wallet(PRIVATE_KEY, provider);
            const factory = new ethers.ContractFactory(MY_ABI, MY_BYTECODE, wallet);

            status.innerText = "Deploying... (Waiting for HOODIE Confirmation)";
            const contract = await factory.deploy();
            await contract.waitForDeployment();

            const address = await contract.getAddress();
            
            // --- SHOW RESULTS ---
            status.innerText = "Confirmed!";
            resultsDiv.style.display = "block";
            
            document.getElementById('contractAddr').innerText = address;
            document.getElementById('abiDisplay').value = JSON.stringify(MY_ABI);
            
            // Update Explorer Link (Adjust URL based on your testnet explorer)
            document.getElementById('explorerLink').href = `https://explorer.hoodie-testnet.io/address/${address}`;

        } catch (error) {
            status.innerText = "Error: " + error.message;
            btn.disabled = false;
        }
    }

    function copyABI() {
        const abiText = document.getElementById('abiDisplay');
        abiText.select();
        document.execCommand("copy");
        alert("ABI copied to clipboard!");
    }

    document.getElementById('deployBtn').addEventListener('click', deploy);
</script>
