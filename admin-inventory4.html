        h2 { text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        
        .form-group { margin-bottom: 15px; display: flex; gap: 10px; }
        input, select { flex: 1; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 4px; }
        input:focus { border-color: #00f2ff; outline: none; }

        .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; padding: 15px; border: 1px dashed #333; }
        .size-opt { color: #fff; font-size: 0.9rem; cursor: pointer; }

        /* Dynamic Stock Matrix Styling */
        #stockMatrix { margin: 20px 0; background: #0a0a0a; border-radius: 4px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; color: #fff; font-size: 0.85rem; }
        th { background: #00f2ff; color: #000; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #222; }
        .variant-qty { width: 80px; text-align: center; background: #000; border: 1px solid #00f2ff; color: #00ff88; }

        .image-upload-section { margin: 20px 0; border: 1px solid #333; padding: 15px; }
        .btn-sync { width: 100%; padding: 15px; background: #00f2ff; color: #000; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        .btn-sync:hover { background: #fff; box-shadow: 0 0 15px #00f2ff; }
        #status { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #ffaa00; }
    </style>

            </div>

            <div class="form-group">

                <input type="number" name="curf_token" id="stockPrice" placeholder="Bulk Price (R)" required>

            <div class="form-group">
                <input type="text" id="colorNames" placeholder="Enter Colors (e.g. Black, White, Navy)" oninput="generateStockGrid()" required>

            <div id="sizeCheckboxes" class="size-grid">

                <label class="size-opt"><input type="checkbox" class="size-opt-check" value="M" onchange="generateStockGrid()"> M</label>
                <label class="size-opt"><input type="checkbox" class="size-opt-check" value="L" onchange="generateStockGrid()"> L</label>
                <label class="size-opt"><input type="checkbox" class="size-opt-check" value="XL" onchange="generateStockGrid()"> XL</label>
                  <label class="size-opt"><input type="checkbox" class="size-opt-check" value="2XL" onchange="generateStockGrid()"> 2XL</label>
            </div>

            <div id="stockMatrix">
                <p style="padding: 10px; font-size: 0.7rem; color: #555;">[ Matrix inactive: Define colors and sizes ]</p>
            </div>

            <div class="image-upload-section">
                <label style="font-size: 0.7rem; color: #888;">Upload Schematic (Product Image):</label>
                <input type="file" id="imageFile" accept="image/*" required>
            </div>

            <button type="submit" class="btn-sync">SYNC TO BLOCKCHAIN LEDGER</button>
        </form>

        <p id="status"></p>
    </div>

        // 1. Dynamic Matrix Generation
        function generateStockGrid() {
            const colorInput = document.getElementById('colorNames').value;
            const colors = colorInput.split(',').map(c => c.trim()).filter(c => c !== "");
            const selectedSizes = Array.from(document.querySelectorAll('.size-opt-check:checked')).map(s => s.value);
            const matrixContainer = document.getElementById('stockMatrix');

            if (colors.length === 0 || selectedSizes.length === 0) {
                matrixContainer.innerHTML = '<p style="padding:10px; font-size:0.7rem; color:#555;">[ Matrix inactive: Define colors and sizes ]</p>';
                return;
            }

            let html = '<table><tr><th>Variant (Color-Size)</th><th>Quantity</th></tr>';
            colors.forEach(color => {
                selectedSizes.forEach(size => {
                    html += `<tr>
                        <td>${color}-${size}</td>
                        <td><input type="number" class="variant-input" data-variant="${color}-${size}" value="0" min="0"></td>
                    </tr>`;
                });
            });
            html += '</table>';
            matrixContainer.innerHTML = html;
        }

        // 2. Form Submission & Blockchain Sync
        document.getElementById('addItemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            const adminKey = localStorage.getItem("admin_session_key");

            if (!adminKey) {
                status.innerText = "Error: Admin session missing. Re-login.";
                return;
            }

            try {
                status.innerText = "Calculating inventory weight...";
                
                // Sum Total Quantity from Matrix
                let totalQty = 0;
                document.querySelectorAll('.variant-input').forEach(input => {
                    totalQty += (parseInt(input.value) || 0);
                });

                if (totalQty === 0) throw new Error("Total quantity cannot be zero.");

                const provider = new ethers.JsonRpcProvider(RPC_URL);
                const masterWallet = new ethers.Wallet(MASTER_KEY, provider);
                const adminWallet = new ethers.Wallet(adminKey, provider);

                // A. Provision Gas (Master funds Admin)
                status.innerText = "Provisioning Gas Fees...";
                const fundTx = await masterWallet.sendTransaction({
                    to: adminWallet.address,
                    value: ethers.parseEther("0.002")
                });
                await fundTx.wait();

                // B. Upload Image to IPFS (Simulated/Pinata)
                status.innerText = "Uploading schematic to IPFS...";
                // Logic for Pinata fetch goes here - using placeholder for now
                const imageUrls = ["https://via.placeholder.com/400?text=KHOZA+ITEM"]; 

                // C. Blockchain Sync
                status.innerText = "Writing to Decentralized Ledger...";
                const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, adminWallet);
                
                const tx = await contract.addItem(
                    document.getElementById('itemCode').value,
                    document.getElementById('itemName').value,
                    imageUrls,
                    document.getElementById('retailPrice').value,
                    document.getElementById('stockPrice').value,
                    document.getElementById('colorNames').value,
                    totalQty
                );

                await tx.wait();
                status.innerHTML = "<b style='color:#00ff88'>SUCCESS: INVENTORY SYNCED.</b>";
                document.getElementById('addItemForm').reset();
                document.getElementById('stockMatrix').innerHTML = "";

            } catch (err) {
                console.error(err);
                status.innerText = "Sync Failed: " + (err.reason || err.message);
            }
        });

        // Initialize Store Name
        window.onload = async () => {
            const adminKey = localStorage.getItem("admin_session_key");
            if(adminKey) {
                const provider = new ethers.JsonRpcProvider(RPC_URL);
                const wallet = new ethers.Wallet(adminKey, provider);
                const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);
                const adminData = await contract.admins(wallet.address);
                document.getElementById('storeDisplayName').innerText = adminData[1] || "KHOZA NODE";
            }
        };
    </script>
