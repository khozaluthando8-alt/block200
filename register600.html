<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHOZA.IO - Secure Registration</title>
    <link rel="stylesheet" href="style1.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body class="reg-body">

    <header class="shop-header">
        <img src="301015489_443828151102927_1957794053294967618_n.png" alt="KHOZA Logo" class="logo">
        <div class="status-info">
            <h1>Identity Portal</h1>
            <p>Registering on Sepolia Ledger...</p>
        </div>
    </header>

    <main class="reg-container">
        <div class="glass-card" id="regCard">
            <h2>Create Account</h2>
            <div class="input-grid">
                <input type="text" id="firstName" placeholder="First Name">
                <input type="text" id="surname" placeholder="Surname">
            </div>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="pass" placeholder="Password">
            <input type="password" id="confirmPass" placeholder="Confirm Password">
            <input type="text" id="deliveryAddress" placeholder="Delivery Address">
            <input type="text" id="phoneNumber" placeholder="Phone Number">
            
            <button class="reg-btn" onclick="register()">INITIALIZE IDENTITY</button>
            <p id="status">Terminal Standby...</p>
        </div>
    </main>

    <footer class="shop-footer">
        <p>&copy; 2026 KHOZA.IO | Secure Blockchain Registration</p>
    </footer>

    <script src="register.js"></script>
        <script src="marketplace-logic.js"></script>
                <script src="GSAP.js"></script>


    <script>
        // GSAP Entrance Animation
        gsap.from("#regCard", {
            duration: 1.2,
            y: 50,
            opacity: 0,
            scale: 0.9,
            ease: "power4.out"
        });
    </script>
</body>
</html>
