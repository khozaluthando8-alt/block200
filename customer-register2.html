      // 1. Real-time ID Generation
    function updateIdentity() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const idBox = document.getElementById('idBox');
        const walletAddr = document.getElementById('walletAddr');

        if(email.length > 5 && pass.length > 5) {
            // Generate the address from the credentials
            const address = ethers.computeAddress(ethers.id(email + pass + "KHOZA_SALT"));
            walletAddr.innerText = address;
            idBox.style.display = "block";
        } else {
            idBox.style.display = "none";
        }
    }


    async function runOnboarding() {

        const status = document.getElementById('status');
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        // Collect inputs 
         const name = document.getElementById('firstName').value;
        const address = document.getElementById('deliveryAddress').value;
      //  const holder = document.getElementById('accHolder').value;
         const num = document.getElementById('phoneNumber').value;
        
        if (!email || !pass || !name) return alert("Please fill in required fields.");

        try {
            btn.disabled = true;
            const provider = new ethers.JsonRpcProvider(RPC_URL);

            // 1. IDENTITY GENERATION
            status.innerText ="Generating user identity...";
            const userSeed = ethers.id(email + pass + "KHOZA_SALT");
            const userWallet = new ethers.Wallet(userSeed, provider);

            // 2. FUNDING CHECK
            const balance = await provider.getBalance(userWallet.address);
            if (balance < ethers.parseEther("0.002")) {
                status.innerText ="Funding gas for registration...";
                const masterWallet = new ethers.Wallet(PRIVATE_KEY, provider);
                const fundTx = await masterWallet.sendTransaction({
                    to: userWallet.address,
                    value: ethers.parseEther("0.002") 
                });
                await fundTx.wait();
                status.innerText ="Gas funded.";
            }

            // 3. CONTRACT INTERACTION 
            const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, userWallet);
            
            status.innerText ="Writing to Blockchain...";
            
            // We pass exactly the 4 strings expected by registerAdmin 
            const regTx = await contract.registerCustomer(
                name,
                address,
                email,
                pass,
                num
            );

            status.innerText ="Finalizing... Tx: " + regTx.hash.substring(0,10);
            await regTx.wait();
            
            status.innerText ="SUCCESS: Registered in KhozaLogistics!";
            btn.disabled = false;


             // 1. Get the current user's wallet address
    // Even without MetaMask "Sign-in", we check the browser's provider for the account
    if (!window.ethereum) {
        window.location.href = 'customer-dashboard.html'; // Default for guest
        return;
    }

    //const provider = new ethers.BrowserProvider(window.ethereum);
    const accounts = await provider.listAccounts();
    
    if (accounts.length === 0) {
        window.location.href = 'customer-dashboard.html';
        return;
    }


        } catch (err) {
            console.error(err);
            status("Error: " + (err.reason || err.message));
            btn.disabled = false;
        }
    }


    
</script>
