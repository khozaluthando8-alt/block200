<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" 
      content="default-src 'self'; 
               script-src 'self' https://cdnjs.cloudflare.com https://cdn.ethers.io; 
               connect-src 'self' https://ethereum-sepolia-rpc.publicnode.com https://gateway.pinata.cloud; 
               img-src 'self' https://gateway.pinata.cloud data:; 
               style-src 'self' 'unsafe-inline';">
    <title>KHOZA.IO - Secure Registration</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { background: #000; color: #00f2ff; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #111; padding: 2rem; border: 1px solid #00f2ff; width: 450px; box-shadow: 0 0 20px rgba(0,242,255,0.2); border-radius: 8px; }
        h2 { text-align: center; text-transform: uppercase; letter-spacing: 2px; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px;}
        input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; background: #00f2ff; border: none; color: #000; font-weight: bold; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        #status { margin-top: 20px; font-size: 0.85rem; text-align: center; color: #00f2ff; min-height: 40px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Identity Registration</h2>
        <input type="text" id="firstName" placeholder="First Name">
        <input type="text" id="surname" placeholder="Surname">
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Password">
          <!-- New Confirm Password Field -->
        <input type="password" id="confirmPass" placeholder="Confirm Password">       
          <input type="text" id="deliveryAddress" placeholder="Delivery Address">
        <input type="text" id="phoneNumber" placeholder="Phone Number">
        <button onclick="register()">Register on Blockchain</button>
        <p id="status">Terminal Standby...</p>
    </div>
<script type="text/javascript" src="config.js"></script>
<script type="text/javascript" src="refuel2.js"></script>
<script type="text/javascript" src="register8.js"></script>
 
</body>
</html>
