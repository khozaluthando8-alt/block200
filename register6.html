<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self'; 
    script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; 
    style-src 'self' 'unsafe-inline'; 
    connect-src 'self' https://eth-sepolia.g.alchemy.com;
">
    <title>KHOZA.IO - Secure Registration</title>
    <link rel="stylesheet" href="style1.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
     <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body class="reg-body">

<!-- Blended Glass Header -->
    <header class="blended-header">
        <div class="logo-wrapper">
            <img src="301015489_443828151102927_1957794053294967618_n.png" alt="KHOZA Logo" class="blended-logo">
        </div>
        <div class="header-text">
            <h1>KHOZA Identity</h1>
            <p>Sepolia Ledger Node</p>
        </div>
    </header>
    
    <main class="reg-container">
        <div class="glass-card" id="regCard">
            <h2>Create Account</h2>
            <div class="input-grid">
                <input type="text" id="firstName" placeholder="First Name">
                <input type="text" id="surname" placeholder="Surname">
            </div>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="pass" placeholder="Password">
            <input type="password" id="confirmPass" placeholder="Confirm Password">
            <input type="text" id="deliveryAddress" placeholder="Delivery Address">
            <input type="text" id="phoneNumber" placeholder="Phone Number">
            
            <button class="reg-btn" onclick="register()">INITIALIZE IDENTITY</button>
            <p id="status">Terminal Standby...</p>
        </div>
    </main>

 <!-- Blended Glass Footer -->
    <footer class="blended-footer">
        <div class="footer-blur"></div>
        <p>&copy; 2026 KHOZA.IO | Blockchain Security Protocol</p>
    </footer>

<script type="text/javascript" src="config.js"></script>
<script type="text/javascript" src="register.js"></script>
<script type="text/javascript" src="GSAP.js"></script>
</body>
</html>
