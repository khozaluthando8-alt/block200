<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales Intelligence Terminal | KHOZA.IO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --neon-blue: #00f2ff; --neon-green: #00ff88; --neon-orange: #ffaa00; }
        body { background: #000; color: var(--neon-blue); font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #0a0a0a; border: 1px solid var(--neon-blue); padding: 25px; border-radius: 8px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 25px; }
        h1 { margin: 0; text-transform: uppercase; font-size: 1.5rem; letter-spacing: 3px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #111; border: 1px solid #222; padding: 20px; text-align: center; }
        .stat-card.alert { border-color: var(--neon-orange); }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #fff; display: block;}
        .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }

        h2 { font-size: 1rem; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        table { width: 100%; border-collapse: collapse; background: #050505; margin-bottom: 40px; }
        th { background: #111; color: var(--neon-blue); text-align: left; padding: 12px; font-size: 0.75rem; border-bottom: 1px solid #333; }
        td { padding: 12px; border-bottom: 1px solid #111; font-size: 0.85rem; color: #ccc; }
        
        .btn-confirm { background: var(--neon-orange); color: #000; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; font-family: inherit; }
        .btn-confirm:hover { background: #fff; box-shadow: 0 0 10px var(--neon-orange); }
        
        .status-pill { padding: 3px 8px; border-radius: 2px; font-size: 0.7rem; font-weight: bold; border: 1px solid; }
        .status-shipped { color: var(--neon-green); border-color: var(--neon-green); background: rgba(0,255,136,0.1); }
        .cust-ref { color: var(--neon-green); font-weight: bold; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Sales Ledger Terminal</h1>
        <button onclick="syncData()" style="padding: 10px 20px; cursor: pointer; background: var(--neon-blue); border:none; font-weight:bold;">SYNC LEDGER</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card alert"><span class="stat-label">Incoming</span><span class="stat-value" id="pendingCount">0</span></div>
        <div class="stat-card"><span class="stat-label">Total Revenue</span><span class="stat-value" id="totalRev">R 0</span></div>
        <div class="stat-card"><span class="stat-label">Verified Sales</span><span class="stat-value" id="historyCount">0</span></div>
    </div>

    <h2><span style="color:var(--neon-orange)">●</span> Incoming (Verify Customer Reference)</h2>
    <table>
        <thead>
            <tr>
                <th>Order Ref</th>
                <th>Customer Profile Ref</th>
                <th>Product</th>
                <th>Qty</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="incomingTable">
            <tr><td colspan="5" style="text-align:center; padding:30px;">Scanning Blockchain...</td></tr>
        </tbody>
    </table>

    <h2><span style="color:var(--neon-green)">●</span> Verified Sales History</h2>
    <table>
        <thead>
            <tr>
                <th>Order Ref</th>
                <th>Customer Profile Ref</th>
                <th>Product</th>
                <th>Earnings</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="historyTable">
            <tr><td colspan="5" style="text-align:center; padding:30px;">Waiting for sync...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com";
    const CONTRACT_ADDRESS = "0x2139e2C85cbD38cCf774D624604d73ff42552fc7";
    const ABI = [
        "function orderCount() public view returns (uint256)",
        "function orders(uint256) public view returns (uint256 id, uint256 productId, address buyer, uint256 quantity, string reference, string status, uint256 timestamp)",
        "function products(uint256) public view returns (uint256 id, address admin, string itemCode, string itemName, uint256 retailPrice)",
        "function customers(address) public view returns (address CustomerId, string Reference, string firstName, string surname, string deliveryAddress, uint256 phoneNumber, string email, bool isActive, bool exists)",
        "function updateOrderStatus(uint256 _orderId, string memory _newStatus) public"
    ];

    async function syncData() {
        const adminKey = localStorage.getItem("admin_session_key");
        if (!adminKey) { alert("Admin Session Not Found"); return; }

        try {
            const provider = new ethers.JsonRpcProvider(RPC_URL);
            const wallet = new ethers.Wallet(adminKey, provider);
            const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);
            
            const count = await contract.orderCount();
            let incomingHtml = "";
            let historyHtml = "";
            let stats = { p: 0, r: 0, h: 0 };

            for (let i = count; i >= 1; i--) {
                const order = await contract.orders(i);
                const product = await contract.products(order.productId);
                
                // Only show orders for this admin
                if (product.admin.toLowerCase() !== wallet.address.toLowerCase()) continue;

                // Fetch customer details to show their permanent Reference
                const customer = await contract.customers(order.buyer);

                if (order.status === "Pending") {
                    stats.p++;
                    incomingHtml += `
                        <tr>
                            <td><b>${order.reference}</b></td>
                            <td class="cust-ref">${customer.Reference || "NOT_FOUND"}</td>
                            <td>${product.itemName}</td>
                            <td>${order.quantity}</td>
                            <td><button class="btn-confirm" onclick="verifyOrder(${i}, '${customer.Reference}')">VERIFY & SHIP</button></td>
                        </tr>
                    `;
                } else {
                    stats.h++;
                    const lineTotal = Number(product.retailPrice) * Number(order.quantity);
                    stats.r += lineTotal;
                    historyHtml += `
                        <tr>
                            <td>${order.reference}</td>
                            <td class="cust-ref">${customer.Reference}</td>
                            <td>${product.itemName}</td>
                            <td>R ${lineTotal.toLocaleString()}</td>
                            <td><span class="status-pill status-shipped">${order.status}</span></td>
                        </tr>
                    `;
                }
            }

            document.getElementById('incomingTable').innerHTML = incomingHtml || "<tr><td colspan='5' style='text-align:center;'>No new signals.</td></tr>";
            document.getElementById('historyTable').innerHTML = historyHtml || "<tr><td colspan='5' style='text-align:center;'>No history.</td></tr>";
            document.getElementById('pendingCount').innerText = stats.p;
            document.getElementById('totalRev').innerText = `R ${stats.revenue.toLocaleString()}`; // Fix: stats.r
            document.getElementById('totalRev').innerText = `R ${stats.r.toLocaleString()}`;
            document.getElementById('historyCount').innerText = stats.h;

        } catch (err) {
            console.error(err);
        }
    }

    async function verifyOrder(orderId, custRef) {
        const adminKey = localStorage.getItem("admin_session_key");
        const confirmMsg = `Verify Shipment for Customer: ${custRef}?\n\nThis will update the ledger permanently.`;
        
        if (!confirm(confirmMsg)) return;

        try {
            const provider = new ethers.JsonRpcProvider(RPC_URL);
            const wallet = new ethers.Wallet(adminKey, provider);
            const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, wallet);

            document.getElementById('incomingTable').innerHTML = "<tr><td colspan='5' style='text-align:center; color:var(--neon-orange)'>BROADCASTING STATUS UPDATE...</td></tr>";
            
            const tx = await contract.updateOrderStatus(orderId, "Shipped");
            await tx.wait();
            
            alert(`SUCCESS: Order confirmed for Customer ${custRef}`);
            syncData();
        } catch (err) {
            alert("Verification Failed. Check Gas.");
            syncData();
        }
    }

    window.onload = syncData;
</script>
</body>
</html>
