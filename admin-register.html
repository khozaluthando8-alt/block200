<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <meta http-equiv="Content-Security-Policy" content="
    default-src 'self'; 
    script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; 
    style-src 'self' 'unsafe-inline'; 
    connect-src 'self' https://ethereum-sepolia-rpc.publicnode.com https://eth-sepolia.g.alchemy.com;
     ">
    <title>KHOZA.IO - Identity Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>

<div class="card">
    <h2 style="text-align:center">ADMIN ONBOARDING</h2>
    
    <label>Authentication</label>
    <input type="email" id="email" placeholder="Email Address" oninput="updateIdentity()">
    <input type="password" id="password" placeholder="Password" oninput="updateIdentity()">
    
    <div id="idBox" class="id-display">
        <strong>ASSIGNED SYSTEM ID:</strong><br>
        <span id="walletAddr">Generating...</span>
    </div>

    <label>Business Profile</label>
    <input type="text" id="storeName" placeholder="Store Name">
    <input type="text" id="bankName" placeholder="Bank Name">
    <input type="text" id="accHolder" placeholder="Account Holder">
    <input type="text" id="accNum" placeholder="Account Number">
    
    <button id="regBtn" onclick="submitToBlockchain()">Deploy Identity</button>
    <p id="status" style="text-align:center; font-size: 0.75rem; color: #555;">Standby...</p>
</div>
<script type="text/javascript" src="register.js"></script>

</body>
</html>
