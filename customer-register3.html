        .id-display { background: #003333; color: #00f2ff; padding: 10px; border: 1px dashed #00f2ff; margin: 15px 0; font-size: 0.8rem; word-break: break-all; display: none; }

    // 1. Real-time ID Generation
    function updateIdentity() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        const idBox = document.getElementById('idBox');
        const walletAddr = document.getElementById('walletAddr');

        if(email.length > 5 && pass.length > 5) {
            // Generate the address from the credentials
            const address = ethers.computeAddress(ethers.id(email + pass + "KHOZA_SALT"));
            walletAddr.innerText = address;
            idBox.style.display = "block";
        } else {
            idBox.style.display = "none";
        }
    }


  async function register() {
    const status = document.getElementById('status');
    try {
        // 1. Collect Data
        const email = document.getElementById('email').value.trim();
        const firstName = document.getElementById('firstName').value.trim();
        const address = document.getElementById('deliveryAddress').value.trim();
        const pass = document.getElementById('pass').value;
        const phone = BigInt(document.getElementById('phoneNumber').value.replace(/\D/g,''));

        // 2. Generate the Customer's Personal Wallet
        const seed = email.toLowerCase() + pass;
        const userWallet = new ethers.Wallet(ethers.keccak256(ethers.toUtf8Bytes(seed)));
        const provider = new ethers.JsonRpcProvider(RPC_URL);
        const customerSigner = userWallet.connect(provider);

        status.innerText = "Verifying identity on ledger...";
        const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, customerSigner);

        // 3. Check if already registered
        const role = await contract.getRole(customerSigner.address);
        if (role === "customer") {
            status.innerText = "Welcome back! Accessing shop...";
            localStorage.setItem("user_session_key", userWallet.privateKey);
            localStorage.setItem("user_role", "customer");
            setTimeout(() => window.location.href = "shop.html", 1500);
            return;
        }

        // 4. FUNDING (The Fix)
        // We must send ETH to customerSigner.address, NOT CONTRACT_ADDRESS
        status.innerText = "Allocating gas for registration...";
        const master = new ethers.Wallet(MASTER_KEY, provider);
        const balance = await provider.getBalance(customerSigner.address);

        if (balance < ethers.parseEther("0.002")) {
            console.log("Funding wallet:", customerSigner.address);
            const fundTx = await master.sendTransaction({
                to: customerSigner.address, // Corrected: sending to user
                value: ethers.parseEther("0.005") 
            });
            await fundTx.wait();
            status.innerText = "Gas fueling complete.";
        }

        // 5. ON-CHAIN REGISTRATION
        status.innerText = "Writing to blockchain...";
        const tx = await contract.registerCustomer(
            email,
            firstName,
            address,
            phone,
            { gasLimit: 400000 } // High gas limit to prevent execution revert
        );

        status.innerText = "Mining transaction...";
        await tx.wait();

        // 6. SAVE SESSION
        localStorage.setItem("user_session_key", userWallet.privateKey);
        localStorage.setItem("user_role", "customer");

        status.innerText = "Registration Success!";
        setTimeout(() => window.location.href = "shop.html", 2000);

    } catch (e) {
        console.error("Full Error:", e);
        // Display a more helpful error if the master wallet is empty
        if (e.message.includes("insufficient funds")) {
            status.innerText = "Error: Master Wallet (Gas Tank) is empty.";
        } else {
            status.innerText = "Error: Registration failed. See console.";
        }
    }
}
