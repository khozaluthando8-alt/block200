    <style>
        body { background: #000; color: #00f2ff; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #111; border: 1px solid #00f2ff; padding: 30px; border-radius: 8px; box-shadow: 0 0 20px rgba(0,242,255,0.1); }
        .back-btn { color: #00f2ff; text-decoration: none; font-size: 0.9rem; border: 1px solid #00f2ff; padding: 5px 10px; border-radius: 4px; transition: 0.3s; margin-bottom: 20px; display: inline-block; }
        .back-btn:hover { background: #00f2ff; color: #000; }
        
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 20px; }
        .product-image { width: 100%; border: 1px solid #333; border-radius: 4px; min-height: 400px; background: #050505; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-image img { width: 100%; height: auto; object-fit: cover; }
        
        h1 { margin: 0; text-transform: uppercase; letter-spacing: 2px; color: #fff; }
        .price-tag { font-size: 2.5rem; color: #00f2ff; margin: 15px 0; font-weight: bold; }
        .meta { color: #888; font-size: 0.85rem; margin: 5px 0; text-transform: uppercase; }
        .stock-status { color: #00ff88; font-weight: bold; }

        /* Quote Box Logic Styling */
        .quote-box { background: #0a0a0a; padding: 20px; border: 1px solid #333; margin-top: 25px; border-radius: 4px; }
        .quote-box label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: #00f2ff; }
        select, input { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #00f2ff; color: #fff; outline: none; }
        
        .quote-result { border-top: 1px dashed #333; padding-top: 15px; }
        .quote-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }
        .grand-total { font-size: 1.4rem; color: #00ff88; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }

        .buy-button { width: 100%; padding: 18px; background: #00f2ff; color: #000; border: none; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        .buy-button:hover { background: #fff; box-shadow: 0 0 20px #00f2ff; }
        #status { margin-top: 20px; font-size: 0.8rem; text-align: center; color: #ffaa00; }

        let currentPrice = 0;

        // 2. DATA INITIALIZATION
        async function loadDetails() {
            const display = document.getElementById('productContainer');
            const productId = localStorage.getItem("selected_product_id");

            if (!productId) {
                display.innerHTML = "<h2>ERROR: NO PRODUCT ID IN LOCAL_STORAGE</h2>";
                return;
            }

            try {
                const provider = new ethers.JsonRpcProvider(RPC_URL);
                const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);

                // Fetch concurrent data
                const [p, images] = await Promise.all([
                    contract.products(productId),
                    contract.getProductImages(productId)
                ]);

                currentPrice = Number(p.retailPrice);

                display.innerHTML = `
                    <div class="product-grid">
                        <div class="product-image">
                            ${images && images.length > 0 
                                ? `<img src="${images[0]}" alt="${p.itemName}">` 
                                : '<span style="color:#444">NO SCHEMATIC FOUND</span>'}
                        </div>
                        <div class="product-info">
                            <p class="meta">REF_CODE: ${p.itemCode}</p>
                            <h1>${p.itemName}</h1>
                            <div class="price-tag">R${currentPrice.toLocaleString()}</div>
                            <p class="meta">STATUS: <span class="stock-status">${p.quantityAvailable.toString()} UNITS IN STOCK</span></p>
                            
                            <div class="quote-box">
                                <label>SELECT REGION:</label>
                                <select id="location" onchange="calculateQuote()">
                                    <option value="Standard">Standard (General) - R100</option>
                                    <option value="Durban CBD">Durban CBD - R50</option>
                                    <option value="Parlock">Overport/Parlock - R80</option>
                                    <option value="Pinetown">PMB/Verulam - R120</option>
                                </select>

                                <label>ORDER QUANTITY:</label>
                                <input type="number" id="qtyInput" value="1" min="1" max="${p.quantityAvailable.toString()}" oninput="calculateQuote()">

                                <div class="quote-result">
                                    <div class="quote-row"><span>Item Total:</span><span id="itemTotal">R 0.00</span></div>
                                    <div class="quote-row"><span>Shipping:</span><span id="shipTotal">R 0.00</span></div>
                                    <div class="quote-row grand-total"><span>Total Cost:</span><span id="grandTotal">R 0.00</span></div>
                                </div>
                            </div>

                            <button class="buy-button" onclick="executePurchase(${productId})">EXECUTE PURCHASE</button>
                            <p id="status"></p>
                        </div>
                    </div>
                `;
                
                calculateQuote(); // Initial calc

            } catch (err) {
                console.error(err);
                display.innerHTML = "<p style='color:red'>DATA_SYNC_ERROR: Check console for logs.</p>";
            }
        }

     function calculateQuote() {
    const qty = parseInt(document.getElementById('qtyInput').value) || 0;
    const location = document.getElementById('location').value;
    
    let shipping = 0;

    if (location === "Durban CBD") {
        if (qty >= 1 && qty <= 4) shipping = 40;
        else if (qty >= 5 && qty <= 10) shipping = 60;
        else if (qty >= 11 && qty <= 20) shipping = 100;
        else if (qty >= 21) shipping = 180;
    } 
    else if (location === "Standard") {
        if (qty >= 1 && qty <= 4) shipping = 60;
        else if (qty >= 5 && qty <= 10) shipping = 100;
        else if (qty >= 11 && qty <= 20) shipping = 180;
        else if (qty >= 21) shipping = 240;
    } 
    else if (location === "Parlock") { // Overport, Morningside, Mayville, Parlock
        if (qty >= 1 && qty <= 4) shipping = 50;
        else if (qty >= 5 && qty <= 10) shipping = 70;
        else if (qty >= 11 && qty <= 20) shipping = 110;
        else if (qty >= 21) shipping = 190;
    } 
    else if (location === "Pinetown") { // PMB, Verulam, Tongaat
        if (qty >= 1 && qty <= 4) shipping = 70;
        else if (qty >= 5 && qty <= 10) shipping = 100;
        else if (qty >= 11 && qty <= 20) shipping = 170;
        else if (qty >= 21) shipping = 230;
    }

    const subtotal = currentPrice * qty;
    const total = subtotal + shipping;

    // Update the UI
    document.getElementById('itemTotal').innerText = `R ${subtotal.toFixed(2)}`;
    document.getElementById('shipTotal').innerText = `R ${shipping.toFixed(2)}`;
    document.getElementById('grandTotal').innerText = `R ${total.toFixed(2)}`;
}
