            const status = document.getElementById('status');
            const email = document.getElementById('email').value.toLowerCase().trim();
            const pass = document.getElementById('pass').value;

            try {
                status.innerText = "Reconstructing Wallet...";
                const userWallet = new ethers.Wallet(ethers.keccak256(ethers.toUtf8Bytes(email + pass)));
                
                const provider = new ethers.JsonRpcProvider(RPC_URL);
                const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);

                // Check role on Blockchain
                const role = await contract.getRole(userWallet.address);
                
                if (role === "none") {
                    status.innerText = "Access Denied: Account not found.";
                    status.style.color = "red";
                    return;
                }

                // Save session for all pages to use
                localStorage.setItem("user_session_key", userWallet.privateKey);
                localStorage.setItem("user_role", role);

                // Route based on Role
                status.innerText = `Redirecting ${role.toUpperCase()}...`;
                
                if (role === "admin") {
                    window.location.href = "admin-inventory3.html";
                } else if (role === "delivery") {
                    window.location.href = "courier-dashboard.html";
                } else if (role === "customer") {
                    window.location.href = "shop.html";
                }

            } catch (e) {
                status.innerText = "Error: System Offline.";
                console.error(e);
            }
        }
    </script>
</body>
