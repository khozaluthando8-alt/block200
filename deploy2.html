        const log = (msg) => {
            const div = document.getElementById('log');
            div.innerHTML += `> ${msg}<br>`;
            console.log(msg);
        };

        async function startDeployment() {
            const btn = document.getElementById('deployBtn');
            btn.disabled = true;
            
            try {
                // 1. Connect to HOODIE Network
                log("Connecting to HOODIE testnet...");
                const provider = new ethers.JsonRpcProvider(HOODIE_RPC);
                const wallet = new ethers.Wallet(PRIVATE_KEY, provider);

                // 2. Check Balance
                const balance = await provider.getBalance(wallet.address);
                log(`Signer Address: ${wallet.address}`);
                log(`Balance: ${ethers.formatEther(balance)} HOODIE`);

                if (balance === 0n) throw new Error("No funds for gas!");

                // 3. Create Factory and Deploy
                log("Initializing Contract Factory...");
                const factory = new ethers.ContractFactory(ABI, BYTECODE, wallet);

                log("Sending Deployment Transaction... (Waiting for block confirmation)");
                const contract = await factory.deploy();
                
                // 4. Wait for receipt
                const txReceipt = await contract.deploymentTransaction().wait();
                const address = await contract.getAddress();

                log("-----------------------------------");
                log(`✅ DEPLOYMENT SUCCESSFUL!`);
                log(`Address: <strong>${address}</strong>`);
                log(`Transaction Hash: ${txReceipt.hash}`);
                log("-----------------------------------");

            } catch (err) {
                log(`❌ ERROR: ${err.message}`);
                btn.disabled = false;
            }
        }

        document.getElementById('deployBtn').addEventListener('click', startDeployment);
    </script>
