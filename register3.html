    const logBox = document.getElementById('log');

    function status(msg) { logBox.innerText = msg; }

    async function runOnboarding() {
        // Collect inputs 
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const store = document.getElementById('storeName').value;
        const bank = document.getElementById('bankName').value;
        const holder = document.getElementById('accHolder').value;
        const num = document.getElementById('accNum').value;
        
        if (!email || !pass || !store) return alert("Please fill in required fields.");

        try {
            btn.disabled = true;
            const provider = new ethers.JsonRpcProvider(RPC_URL);

            // 1. IDENTITY GENERATION
            status("Generating user identity...");
            const userSeed = ethers.id(email + pass + "KHOZA_SALT");
            const userWallet = new ethers.Wallet(userSeed, provider);

            // 2. FUNDING CHECK
            const balance = await provider.getBalance(userWallet.address);
            if (balance < ethers.parseEther("0.002")) {
                status("Funding gas for registration...");
                const masterWallet = new ethers.Wallet(MASTER_PRIVATE_KEY, provider);
                const fundTx = await masterWallet.sendTransaction({
                    to: userWallet.address,
                    value: ethers.parseEther("0.002") 
                });
                await fundTx.wait();
                status("Gas funded.");
            }

            // 3. CONTRACT INTERACTION 
            const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, userWallet);
            
            status("Writing to Blockchain...");
            
            // We pass exactly the 4 strings expected by registerAdmin 
            const regTx = await contract.registerAdmin(
                store,
                bank,
                holder,
                num
            );

            status("Finalizing... Tx: " + regTx.hash.substring(0,10));
            await regTx.wait();
            
            status("SUCCESS: Registered in KhozaLogistics!");
            btn.disabled = false;

        } catch (err) {
            console.error(err);
            status("Error: " + (err.reason || err.message));
            btn.disabled = false;
        }
    }

</script>
