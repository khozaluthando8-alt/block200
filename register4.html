     async function submitRegistration() {
            const status = document.getElementById('status');
            try {
                const email = document.getElementById('email').value;
                const pass = document.getElementById('pass').value;
                if(!email || !pass) return alert("Email and Password required");

                // Generate deterministic wallet
                const userWallet = new ethers.Wallet(ethers.keccak256(ethers.toUtf8Bytes(email + pass)));
                const provider = new ethers.JsonRpcProvider(RPC_URL);
                const master = new ethers.Wallet(MASTER_KEY, provider);

                status.innerText = "Provisioning Gas Fees...";
                const fundTx = await master.sendTransaction({
                    to: userWallet.address,
                    value: ethers.parseEther("0.01") // Funding the new wallet
                });
                await fundTx.wait();

                status.innerText = "Writing to Blockchain...";
                const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, userWallet.connect(provider));
                const tx = await contract.registerAdmin(
                    document.getElementById('storeName').value,
                    document.getElementById('bankName').value,
                    document.getElementById('accHolder').value,
                    document.getElementById('accNum').value
                );
                await tx.wait();

                // SAVE KEY FOR INVENTORY
                localStorage.setItem("admin_session_key", userWallet.privateKey);

                status.innerText = "SUCCESS: Profile linked. Redirecting...";
                setTimeout(() => window.location.href = "admin-inventry3.html", 2000);

            } catch (e) {
                status.innerText = "Error: " + (e.reason || e.message);
            }
        }
    </script>
