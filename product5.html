<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | KHOZA.IO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="cart-logic.js"></script>
    <style>
        body { background: #000; color: #00f2ff; font-family: 'Courier New', monospace; margin: 0; padding: 20px; padding-top: 80px; }
        
        /* Floating Nav with View Cart */
        .top-nav { 
            position: fixed; top: 0; left: 0; width: 100%; height: 60px; 
            background: rgba(0, 0, 0, 0.9); border-bottom: 1px solid #00f2ff; 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 30px; box-sizing: border-box; z-index: 1000;
        }
        .nav-logo { font-weight: bold; letter-spacing: 2px; }
        .view-cart-btn { 
            background: #00f2ff; color: #000; text-decoration: none; 
            padding: 8px 15px; font-weight: bold; font-size: 0.8rem; 
            border-radius: 2px; transition: 0.3s; 
        }
        .view-cart-btn:hover { background: #fff; box-shadow: 0 0 15px #00f2ff; }

        .container { max-width: 950px; margin: 0 auto; background: #111; border: 1px solid #00f2ff; padding: 30px; border-radius: 8px; }
        .back-btn { color: #00f2ff; text-decoration: none; font-size: 0.8rem; margin-bottom: 20px; display: inline-block; }
        
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        
        /* Slider Styles */
        .slider-viewport { width: 100%; aspect-ratio: 1 / 1; border: 1px dashed #00f2ff; background: #050505; overflow: hidden; position: relative; }
        .slider-wrapper { display: flex; height: 100%; }
        .slider-item { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; text-align: center; color: #444; }
        .slider-item img { max-width: 90%; max-height: 90%; object-fit: contain; }

        .slider-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; background: #000; padding: 5px; border: 1px solid #333; }
        .nav-btn { background: none; border: 1px solid #00f2ff; color: #00f2ff; padding: 4px 12px; cursor: pointer; font-family: 'Courier New'; font-size: 0.7rem; }

        /* Order Box */
        h1 { margin: 0; text-transform: uppercase; color: #fff; font-size: 1.5rem; }
        .price-tag { font-size: 2rem; color: #00ff88; margin: 10px 0; }
        .quote-box { background: #000; border: 1px solid #333; padding: 15px; margin-top: 15px; }
        label { display: block; font-size: 0.65rem; color: #00f2ff; margin-top: 10px; }
        select, input { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 8px; font-family: 'Courier New'; box-sizing: border-box; }
        
        .quote-result { margin-top: 15px; border-top: 1px dashed #333; padding-top: 10px; font-size: 0.8rem; }
        .quote-row { display: flex; justify-content: space-between; margin-bottom: 4px; }

        .buy-button { width: 100%; padding: 15px; background: #00f2ff; color: #000; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        
        @media (max-width: 768px) { .product-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-logo">KHOZA.IO / MARKET</div>
        <a href="cart.html" class="view-cart-btn">VIEW CART [<span id="cartCount">0</span>]</a>
    </nav>

    <div class="container">
        <a href="shop.html" class="back-btn"><- BACK TO NODES</a>
        <div id="productDetail">
            <p>> SYNCHRONIZING WITH BLOCKCHAIN...</p>
        </div>
    </div>

    <script>
        const RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com";
        const CONTRACT_ADDRESS = "0x0E763c0d3bCdFa4f744B9DE3355B67B3A9b262Ba";
        const GATEWAY = "https://gateway.pinata.cloud/ipfs/";
        
        let currentPrice = 0;
        let currentIndex = 0;
        let totalImages = 0;

        const ABI = [
            {"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"products","outputs":[{"internalType":"uint256","name":"id","type":"uint256"},{"internalType":"address","name":"admin","type":"address"},{"internalType":"string","name":"itemCode","type":"string"},{"internalType":"string","name":"itemName","type":"string"},{"internalType":"uint256","name":"retailPrice","type":"uint256"},{"internalType":"uint256","name":"stockPrice","type":"uint256"},{"internalType":"string","name":"colour","type":"string"},{"internalType":"uint256","name":"quantityAvailable","type":"uint256"},{"internalType":"uint256","name":"totalSold","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_pId","type":"uint256"}],"name":"getProductImages","outputs":[{"internalType":"string[]","name":"","type":"string[]"}],"stateMutability":"view","type":"function"}
        ];

        async function loadDetails() {
            const display = document.getElementById('productDetail');
            const productId = localStorage.getItem("selected_product_id");

            if (!productId) {
                display.innerHTML = "<h2>ERROR: NULL_ID</h2>";
                return;
            }

            try {
                const provider = new ethers.JsonRpcProvider(RPC_URL);
                const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);

                const [p, rawImages] = await Promise.all([
                    contract.products(productId),
                    contract.getProductImages(productId)
                ]);

                currentPrice = Number(p.retailPrice);
                const images = rawImages.filter(img => img).map(img => img.startsWith('http') ? img : `${GATEWAY}${img}`);
                totalImages = images.length;

                display.innerHTML = `
                    <div class="product-grid">
                        <div class="slider-section">
                            <div class="slider-viewport">
                                <div class="slider-wrapper" id="sliderWrapper">
                                    ${totalImages > 0 
                                        ? images.map(src => `<div class="slider-item"><img src="${src}"></div>`).join('')
                                        : '<div class="slider-item">NO_IMAGE_DATA_ON_CHAIN</div>'}
                                </div>
                            </div>
                            ${totalImages > 1 ? `
                            <div class="slider-nav">
                                <button class="nav-btn" onclick="moveSlider(-1)">PREV</button>
                                <span id="imgCounter" style="font-size:0.6rem">${(currentIndex + 1)} / ${totalImages}</span>
                                <button class="nav-btn" onclick="moveSlider(1)">NEXT</button>
                            </div>` : ''}
                        </div>

                        <div class="product-info">
                            <h1>${p.itemName}</h1>
                            <div class="price-tag">R${currentPrice.toLocaleString()}</div>
                            
                            <div class="quote-box">
                                <label>SIZE</label>
                                <select id="itemSize"><option>S</option><option>M</option><option>L</option><option>XL</option></select>
                                
                                <label>COLOUR</label>
                                <select id="itemColor"><option>Black</option><option>White</option><option>Navy</option></select>

                                <label>LOCATION</label>
                                <select id="location" onchange="updateTotals()">
                                    <option value="Standard">Standard (SA)</option>
                                    <option value="Durban CBD">Durban CBD</option>
                                    <option value="Parlock">Parlock</option>
                                    <option value="Pinetown">Pinetown</option>
                                </select>

                                <label>QUANTITY</label>
                                <input type="number" id="qtyInput" value="1" min="1" oninput="updateTotals()">

                                <div class="quote-result">
                                    <div class="quote-row"><span>Shipping:</span><span id="shipFee">R 0.00</span></div>
                                    <div class="quote-row"><strong>Total:</strong><span id="finalTotal">R 0.00</span></div>
                                </div>
                            </div>

                            <button class="buy-button" onclick="handleAddToCart('${productId}', '${p.itemName}', '${images[0] || ''}')">
                                ADD TO NODE CART
                            </button>
                        </div>
                    </div>
                `;
                updateTotals();
                updateBadge();
            } catch (err) {
                display.innerHTML = "<p>CONNECTION_ERROR</p>";
            }
        }

        function moveSlider(dir) {
            currentIndex = (currentIndex + dir + totalImages) % totalImages;
            gsap.to("#sliderWrapper", { xPercent: -100 * currentIndex, duration: 0.3 });
            document.getElementById('imgCounter').innerText = `${currentIndex + 1} / ${totalImages}`;
        }

        function updateTotals() {
            const qty = parseInt(document.getElementById('qtyInput').value) || 1;
            const loc = document.getElementById('location').value;
            const rates = { "Durban CBD": [40, 60, 100, 180], "Parlock": [50, 70, 110, 190], "Pinetown": [70, 100, 170, 230], "Standard": [60, 100, 180, 240] };
            const selected = rates[loc] || rates["Standard"];
            
            let ship = selected[0];
            if (qty > 4) ship = selected[1];
            if (qty > 10) ship = selected[2];
            if (qty > 20) ship = selected[3];

            document.getElementById('shipFee').innerText = `R ${ship.toLocaleString()}`;
            document.getElementById('finalTotal').innerText = `R ${(currentPrice * qty + ship).toLocaleString()}`;
            return { ship, total: (currentPrice * qty + ship) };
        }

        function handleAddToCart(id, name, img) {
            const qty = parseInt(document.getElementById('qtyInput').value);
            const variant = `${document.getElementById('itemSize').value} / ${document.getElementById('itemColor').value}`;
            const calculations = updateTotals();

            const item = {
                id, name, price: currentPrice, image: img, quantity: qty,
                location: `${document.getElementById('location').value} (${variant})`,
                shipping: calculations.ship,
                itemTotal: calculations.total
            };

            if (typeof addToCart === 'function') {
                addToCart(item); //[cite: 11]
                updateBadge();
            }
        }

        function updateBadge() {
            const cart = JSON.parse(localStorage.getItem('khoza_cart') || "[]");
            document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.quantity, 0);
        }

        window.onload = loadDetails;
    </script>
</body>
</html>
