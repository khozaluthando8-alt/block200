<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Configuration | KHOZA.IO</title>
     <link rel="stylesheet" href="style20.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="cart-logic2.js"></script>
<script src="product16.js"></script>
</head>
<body>

    <header class="shop-header">
        <div class="header-content">
            <img src="301015489_443828151102927_1957794053294967618_n.png" alt="LOGO" class="logo">
            <div class="status-info">
                <h1>Order Configuration</h1>
                <p id="connectionStatus" style="font-size:0.6rem; color:var(--accent-blue)">NODE: CONNECTED</p>
            </div>
            <a href="cart2.html" class="cart-link">CART: [<span id="cartCount">0</span>]</a>
        </div>
    </header>

    <main class="container">
        <div id="productDetail">
            <p style="text-align:center">Loading Secure Ledger...</p>
        </div>
    </main>

    <div class="product-glass-layout">
    <h3 style="margin-top:0; color:var(--accent-blue);">Configuration</h3>
    
    <div class="input-group">
        <label>Delivery Address</label>
        <input type="text" id="deliveryAddress" placeholder="Enter full street address" required style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ddd;">
    </div>

    <div id="variantContainer">
        <div class="unit-row" style="display:flex; gap:10px; margin-bottom:10px;">
            <input type="text" class="unit-size" placeholder="Type Size" oninput="emitItemQuantity(this)" style="flex:1; padding:8px;">
            <input type="text" class="unit-color" placeholder="Type Colour" oninput="emitItemQuantity(this)" style="flex:1; padding:8px;">
        </div>
    </div>
     <div class="input-group">
        <label>Total Units</label>
        <input type="number" id="mainQty" value="1" min="1" style="width:100%; padding:10px;">
    </div>

    <button type="button" onclick="addVariantRow()" style="background:none; border:1px dashed #007bff; color:#007bff; width:100%; padding:5px; margin-bottom:15px; cursor:pointer;">+ ADD ANOTHER VARIANT</button>

   
   
</div>

    <footer class="shop-footer">
        <p>&copy; 2026 KHOZA.IO - Logistics Network [Parlock/Pinetown/Durban][cite: 1]</p>
    </footer>

   
</body>
</html>
