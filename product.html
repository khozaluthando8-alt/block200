        async function loadDetails() {
            const display = document.getElementById('productDetail');
            const productId = localStorage.getItem("selected_product_id");

            if (!productId) {
                display.innerHTML = "<h2>Error: No Product Selected</h2>";
                return;
            }

            try {
                const provider = new ethers.JsonRpcProvider(RPC_URL);
                const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);

                // Fetch data from cfw11.sol
                const p = await contract.products(productId);

                display.innerHTML = `
                    <div class="product-grid">
                        <div class="product-image">
                            ${p.imageUrls && p.imageUrls.length > 0 
                                ? `<img src="${p.imageUrls[0]}" alt="${p.itemName}">` 
                                : '<span>NO SCHEMATIC AVAILABLE</span>'}
                        </div>
                        <div class="product-info">
                            <p class="meta">ITEM_CODE: ${p.itemCode}</p>
                            <h1>${p.itemName}</h1>
                            <p class="price">R${p.retailPrice.toString()}</p>
                            <p class="meta">AVAILABILITY: <span class="stock">${p.quantityAvailable.toString()} UNITS</span></p>
                            <p class="meta">OWNER_NODE: ${p.admin.substring(0, 10)}...</p>
                            
                            <button class="buy-button" onclick="purchaseItem(${productId})">INITIALIZE PURCHASE</button>
                            <p id="status"></p>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                display.innerHTML = "<p>Error: Failed to sync with blockchain.</p>";
            }
        }

        async function purchaseItem(id) {
            const status = document.getElementById('status');
            status.innerText = "System Note: Purchase logic requires wallet signature. Integration pending.";
            // This is where you would call your contract's order function later.
        }

        window.onload = loadDetails;
    </script>
